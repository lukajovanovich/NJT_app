<div class="app-background" aria-hidden="true">
  <img
    #backgroundImage
    class="app-background__image"
    src="assets/pozadina.jpeg"
    alt=""
    [style.transform]="'translate3d(-50%, ' + backgroundShift + ', 0)'"
    (load)="updateBackgroundShift()"
  />
  <div class="app-background__overlay"></div>
</div>

<div class="app-shell">
  <app-navbar (logoutEvent)="logout()"></app-navbar>
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>

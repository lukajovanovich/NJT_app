# --- DATABASE CONFIGURATION ---
spring.config.import=optional:file:./local/application-mail.properties,optional:file:./app/local/application-mail.properties

app.name=App za upravljanje projektima
app.default-team-names=Analiza,Dizajn,Razvoj,Testiranje
app.jwt.secret=AppZaUpravljanjeProjektimaJwtSecretKljuc2026
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:mysql://localhost:3306/njt_up
spring.datasource.username=root
spring.datasource.password=

# Automatically create/update tables according to entities
spring.jpa.hibernate.ddl-auto=update

# Prikazi pravu poruku greske u JSON odgovoru (korisno za debagovanje)
server.error.include-message=always

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# --- JACKSON CONFIGURATION ---
# Keep JSON field names exactly as in Java
#spring.jackson.property-naming-strategy=PROPERTY_NAMING_STRATEGY_IDENTITY

# Optional: pretty-print JSON in responses
spring.jackson.serialization.indent_output=true

# --- OPTIONAL: TIME ZONE AND DATE HANDLING ---
# Make sure Hibernate handles Java 8 date/time correctly
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- EMAIL CONFIGURATION ---
# Ukljuci na true kada uneses validan SMTP nalog.
app.mail.enabled=${APP_MAIL_ENABLED:false}

# Opcioni mail koji se prikazuje kao posiljalac.
app.mail.from=${APP_MAIL_FROM:}
app.mail.display-name=${APP_MAIL_DISPLAY_NAME:${app.name}}

# Opcioni dodatni admin primaoci, odvojeni zarezom.
app.mail.admin-recipients=${APP_MAIL_ADMIN_RECIPIENTS:}

# Primer za Gmail SMTP. Za Gmail koristi App Password, ne obicnu sifru.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
